<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Senin İçin...</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #fdfbf7; 
            font-family: 'Courier New', Courier, monospace;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 30px 15px; /* Telefone özel kenar boşlukları */
        }
        h1 {
            font-size: 2em; /* Ekrana sığması için küçültüldü */
            color: #d6807a; 
            margin-bottom: 8px;
            margin-top: 10px;
        }
        p.subtitle {
            font-style: italic;
            font-size: 0.9em;
            margin-bottom: 30px;
            color: #666;
        }
        .spotify-container {
            margin: 0 auto 40px auto;
            width: 100%;
            max-width: 350px; /* Telefon ekranı genişliği */
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            border-radius: 12px;
        }
        .gallery {
            display: flex;
            flex-direction: column; /* Telefondan dolayı alt alta sıralanacaklar */
            align-items: center;
            gap: 35px;
            width: 100%;
        }
        /* Polaroid Tasarımı */
        .polaroid {
            background: #fff;
            padding: 12px 12px 35px 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            width: 90%; 
            max-width: 320px; /* Telefonda çok taşmaması için sınır */
            border-radius: 2px;
        }
        /* Telefondaki kaydırma hissine uygun hafif eğimler */
        .polaroid:nth-child(odd) {
            transform: rotate(-2deg);
        }
        .polaroid:nth-child(even) {
            transform: rotate(2deg);
        }
        .polaroid img {
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1; /* Fotoğrafları tam kare yapar */
            object-fit: cover;
            background-color: #eee; 
        }
        .lyric {
            margin-top: 15px;
            font-size: 0.95em;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>Sana Özel Bir Frekans</h1>
    <p class="subtitle">Kelimelerin yetmediği yerde müzik başlar...</p>

    <!-- Spotify Çalma Listesi -->
    <div class="spotify-container">
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/4sL4klKPwgcNhbWbZLdm8d?utm_source=generator&si=160cdadf0758482e" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

    <!-- Polaroid Fotoğraf Galerisi -->
    <div class="gallery">
        <!-- 1. Fotoğraf -->
        <div class="polaroid">
            <img src="foto1.jpg" alt="Bizim Fotoğrafımız">
            <div class="lyric">"Karlar erir, mevsimler geçer de içimdeki senin izi kalır..."</div>
        </div>
        
        <!-- 2. Fotoğraf -->
        <div class="polaroid">
            <img src="foto2.jpg" alt="Bizim Fotoğrafımız">
            <div class="lyric">"Gözlerinde kaybolmak gibi..."</div>
        </div>

        <!-- 3. Fotoğraf -->
        <div class="polaroid">
            <img src="foto3.jpg" alt="Bizim Fotoğrafımız">
            <div class="lyric">"En sevdiğim şarkı sensin."</div>
        </div>
    </div>

</body>
</html>
