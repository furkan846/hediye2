<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Senin İçin...</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #fdfbf7; 
            font-family: 'Courier New', Courier, monospace;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 30px 15px; 
            overflow-x: hidden; 
            position: relative;
        }
        h1 {
            font-size: 2em; 
            color: #d6807a; 
            margin-bottom: 8px;
            margin-top: 10px;
        }
        p.subtitle {
            font-style: italic;
            font-size: 0.9em;
            margin-bottom: 30px;
            color: #666;
        }
        .spotify-container {
            margin: 0 auto 40px auto;
            width: 100%;
            max-width: 350px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            border-radius: 12px;
            position: relative;
            z-index: 10;
        }
        .gallery {
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 35px;
            width: 100%;
            position: relative;
            z-index: 10;
            padding-bottom: 50px;
        }
        .polaroid {
            background: #fff;
            padding: 12px 12px 35px 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            width: 90%; 
            max-width: 320px; 
            border-radius: 2px;
        }
        .polaroid:nth-child(odd) {
            transform: rotate(-2deg);
        }
        .polaroid:nth-child(even) {
            transform: rotate(2deg);
        }
        .polaroid img {
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1; 
            object-fit: cover;
            background-color: #eee; 
        }
        .lyric {
            margin-top: 15px;
            font-size: 0.95em;
            font-weight: bold;
            color: #555;
        }

        /* --- GÜL YAPRAĞI ANİMASYONU --- */
        .petal {
            position: fixed;
            top: -10vh; /* Ekranın üstünden başlar */
            pointer-events: none; /* Tıklanmayı engellemez */
            z-index: 5;
            background-image: url('https://cdn.pixabay.com/photo/2014/04/02/10/38/rose-304090_1280.png'); /* Şeffaf gerçek gül yaprağı */
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        /* Yaprakların Farklı Boyutları, Pozisyonları ve Hızları */
        .p1 { left: 10%; width: 40px; height: 40px; animation-duration: 9s; animation-delay: 0s; }
        .p2 { left: 30%; width: 25px; height: 25px; animation-duration: 12s; animation-delay: 2s; }
        .p3 { left: 50%; width: 50px; height: 50px; animation-duration: 8s; animation-delay: 4s; }
        .p4 { left: 70%; width: 35px; height: 35px; animation-duration: 11s; animation-delay: 1s; }
        .p5 { left: 85%; width: 45px; height: 45px; animation-duration: 10s; animation-delay: 3s; }
        .p6 { left: 20%; width: 30px; height: 30px; animation-duration: 13s; animation-delay: 5s; }
        .p7 { left: 80%; width: 38px; height: 38px; animation-duration: 9.5s; animation-delay: 6s; }

        @keyframes fall {
            0% {
                top: -10vh;
                transform: translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8; /* Gökten girerken görünür olur */
            }
            50% {
                transform: translateX(40px) rotate(180deg); /* Sağa doğru salınım */
            }
            100% {
                top: 110vh; /* Ekranın altına düşer */
                transform: translateX(-40px) rotate(360deg); /* Sola doğru salınım */
                opacity: 0; /* Kaybolur */
            }
        }
    </style>
</head>
<body>

    <!-- Gül Yaprakları -->
    <div class="petal p1"></div>
    <div class="petal p2"></div>
    <div class="petal p3"></div>
    <div class="petal p4"></div>
    <div class="petal p5"></div>
    <div class="petal p6"></div>
    <div class="petal p7"></div>

    <h1>Sana Özel Bir Frekans</h1>
    <p class="subtitle">Kelimelerin yetmediği yerde müzik başlar...</p>

    <!-- Spotify Çalma Listesi -->
    <div class="spotify-container">
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M?utm_source=generator" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

    <!-- Polaroid Fotoğraf Galerisi -->
    <div class="gallery">
        <div class="polaroid">
            <img src="foto1.jpg" alt="Bizim Fotoğrafımız">
            <div class="lyric">"Seninle her şey daha güzel..."</div>
        </div>
        
        <div class="polaroid">
            <img src="foto2.jpg" alt="Bizim Fotoğrafımız">
            <div class="lyric">"Gözlerinde kaybolmak gibi..."</div>
        </div>

        <div class="polaroid">
            <img src="foto3.jpg" alt="Bizim Fotoğrafımız">
            <div class="lyric">"En sevdiğim şarkı sensin."</div>
        </div>
    </div>

</body>
</html>
